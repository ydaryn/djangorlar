<h1>City Time</h1>
<form method="get">
    <select name="city">
        {% for city in cities %}
        <option value="{{ city }}" {% if city == selected_city %}selected{% endif %}>{{ city }}</option>
        {% endfor %}
    </select>
    <button type="submit">Show Time</button>
</form>

{% if current_time %}
<p>Current time in {{ selected_city }}: {{ current_time }}</p>
{% endif %}
<a href="{% url 'welcome' %}">Back</a>
